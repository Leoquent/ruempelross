name: Deploy website to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ruempelross-vps
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check website integrity
        run: |
          python3 tests/site_integrity.py
          node --test tests/quiz-regression.cjs
          node tests/gallery_gestures.cjs
          python3 tests/mail-layout.py
          python3 tests/delivery-retention.py
      - name: Deploy main to VPS
        env:
          DEPLOY_TOKEN: ${{ secrets.VPS_DEPLOY_TOKEN }}
        run: |
          curl --fail --silent --show-error --connect-timeout 15 --max-time 120 \
            --request POST --header "Authorization: Bearer $DEPLOY_TOKEN" \
            https://www.ruempelross.de/__deploy/ruempelross
      - name: Check live website
        run: curl --fail --silent --show-error --retry 3 https://www.ruempelross.de/ --output /dev/null
